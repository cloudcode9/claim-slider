<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>예상 보험금 슬라이더</title>
<style>
:root{--fg:#37352f;--muted:#9b9a97;--line:#e9e9e7;--lo:#2f80ed;--hi:#eb5757}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--fg);background:#fff;padding:16px}
.total{font-size:34px;font-weight:700;letter-spacing:-.5px}.sub{color:var(--muted);font-size:13px;margin-top:2px}
input[type=range]{width:100%;margin:18px 0 6px;accent-color:#37352f;height:28px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.ends b{color:var(--fg);font-weight:600}
.rows{margin-top:16px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr 78px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.bar{position:relative;height:10px;background:#f1f1ef;border-radius:5px}
.rng{position:absolute;top:0;height:10px;background:#e3e2e0;border-radius:5px}
.fill{position:absolute;top:0;left:0;height:10px;background:#37352f;border-radius:5px}
.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
</style></head><body>
<div class="total" id="total"></div>
<div class="sub" id="label"></div>
<input type="range" id="s" min="0" max="100" value="0" step="1" aria-label="보수적 ↔ 낙관적">
<div class="ends"><span><b>보수적</b><br>경찰 목록 물건만 · 품목별 감가</span><span style="text-align:right"><b>낙관적</b><br>전 품목 인정 · 지은 님 계산</span></div>
<div class="rows" id="rows"></div>
<div class="note">자기부담금 1만원 차감 · 여권 1인 6만원(성재·은경·영국·유주) 포함 · 중간 값은 두 시나리오 사이를 비례로 나눈 추정치</div>
<script>
const D=[["강성재", 769606, 1050000], ["권지은", 130576, 826000], ["권민재", 379990, 849150], ["장은경", 250000, 440000], ["권영국", 136283, 498000], ["강유주", 60000, 60000]];const MAX=Math.max(...D.map(d=>d[2]));
const fmt=v=>(v/10000).toFixed(1)+'만';const s=document.getElementById('s');
const rows=document.getElementById('rows');
D.forEach(d=>{rows.insertAdjacentHTML('beforeend',`<div class="row"><span>${d[0].slice(1)}</span><div class="bar"><div class="rng" style="left:${d[1]/MAX*100}%;width:${(d[2]-d[1])/MAX*100}%"></div><div class="fill"></div></div><span class="amt"></span></div>`)});
function upd(){const t=s.value/100;let tot=0;[...rows.children].forEach((r,i)=>{const d=D[i];const v=d[1]+(d[2]-d[1])*t;tot+=v;r.querySelector('.fill').style.width=(v/MAX*100)+'%';r.querySelector('.amt').textContent=fmt(v)});
document.getElementById('total').textContent='약 '+fmt(tot)+'원';
document.getElementById('label').textContent=t==0?'가장 보수적인 경우':t==1?'가장 낙관적인 경우':`보수 ${100-s.value}% · 낙관 ${s.value}%`}
s.addEventListener('input',upd);upd();
</script></body></html>

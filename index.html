<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>예상 보험금 슬라이더</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#37352f;background:#fff;padding:10px 14px;overflow:hidden}
.top{display:flex;align-items:baseline;gap:10px}.total{font-size:22px;font-weight:700;letter-spacing:-.3px}.sub{color:#9b9a97;font-size:12px}
input[type=range]{width:100%;margin:6px 0 2px;accent-color:#37352f;height:22px}
.ends{display:flex;justify-content:space-between;font-size:11px;color:#9b9a97}.ends b{color:#37352f}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;margin-top:8px}
.cell .row{display:flex;justify-content:space-between;font-size:12px}.cell .row b{font-variant-numeric:tabular-nums}
.bar{position:relative;height:5px;background:#f1f1ef;border-radius:3px;margin-top:3px}
.rng{position:absolute;top:0;height:5px;background:#dcdbd8;border-radius:3px}.fill{position:absolute;top:0;left:0;height:5px;background:#37352f;border-radius:3px}
.note{font-size:10px;color:#9b9a97;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div class="top"><span class="total" id="total"></span><span class="sub" id="label"></span></div>
<input type="range" id="s" min="0" max="100" value="0" step="1" aria-label="보수적 ↔ 낙관적">
<div class="ends"><span><b>보수적</b> 경찰 목록만 · 품목별 감가</span><span><b>낙관적</b> 전 품목 · 지은 님 계산</span></div>
<div class="grid" id="g"></div>
<div class="note">자기부담금 1만원 차감 · 여권 1인 6만원(성재·은경·영국·유주) 포함 · 중간 값은 비례 추정</div>
<script>
const D=[["강성재", 769606, 1050000], ["권지은", 130576, 826000], ["권민재", 379990, 849150], ["장은경", 250000, 440000], ["권영국", 136283, 498000], ["강유주", 60000, 60000]],MAX=Math.max(...D.map(d=>d[2])),fmt=v=>(v/10000).toFixed(1)+'만',s=document.getElementById('s'),g=document.getElementById('g');
D.forEach(d=>g.insertAdjacentHTML('beforeend',`<div class="cell"><div class="row"><span>${d[0].slice(1)}</span><b></b></div><div class="bar"><div class="rng" style="left:${d[1]/MAX*100}%;width:${(d[2]-d[1])/MAX*100}%"></div><div class="fill"></div></div></div>`));
function upd(){const t=s.value/100;let tot=0;[...g.children].forEach((c,i)=>{const d=D[i],v=d[1]+(d[2]-d[1])*t;tot+=v;c.querySelector('.fill').style.width=v/MAX*100+'%';c.querySelector('b').textContent=fmt(v)});
document.getElementById('total').textContent='약 '+fmt(tot)+'원';document.getElementById('label').textContent=t==0?'가장 보수적':t==1?'가장 낙관적':`낙관 ${s.value}%`}
s.addEventListener('input',upd);upd();
</script></body></html>
